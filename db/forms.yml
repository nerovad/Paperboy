    page_number: 4
    position: 16
    required: true
    options:
      information_text: ".*\r\nInitial Here*: CRC Date*: 10/31/2022 Employee ID 130799
        Employee Name*: Carmen Contreras *:\r\n1. I am bound by all the terms and
        conditions of the County’s Leave of Absence Program and that the County has
        the\r\nright to grant or deny any request for a leave of absence or an extension
        thereof, subject by provisions of the Federal\r\nFamily Medical Leave Act,
        the California Family Rights Act, the California Pregnancy Disability Leave
        rights,\r\napplicable collective bargaining agreements, Article 22, Section
        2203 of the County of Ventura Personnel Rules and\r\nRegulations, and the
        County Administrative Policy Manual.\r\n2. I may be required to make premium
        payments directly to the County or its third-party administrator while on
        leave of\r\nabsence. If I fail to make payments on a timely basis, coverage
        under that benefit will be canceled until I return from\r\nleave and deductions
        resume. If the County mistakenly pays any premiums on my behalf, I agree to
        repay the County\r\ndirectly or through wage/salary deduction.\r\n3. The failure
        to return to work on the day following the “Date Leave Ends” may be considered
        inexcusable absence\r\nwithout leave and subject me to disciplinary action.
        I also understand that if I am absent from work without\r\nauthorization for
        three (3) days or two (2) consecutive twenty-four hour work shifts beginning
        with the day following\r\nthe “Date Leave Ends” I have entered on the front
        of this form, the County may deem that I have voluntarily\r\nabandoned my
        job under Article 22, Section 2203, of the County of Ventura Personnel Rules
        and Regulations.\r\n4. Failure to provide a complete and sufficient medical
        certification may result in a denial of my leave of absence\r\nrequest. I
        further understand that I may be required to provide periodic reports on my
        status and intent to return to\r\nwork. I agree to notify BOTH, my supervisor
        and leave of absence coordinator of my availability to return to full or\r\nrestricted
        duty if I am released by my doctor prior to the end of an approved medical
        leave of absence.\r\n5. I agree to comply with the County’s Integration policy
        to which employees may use approved leave bank hours in\r\nconjunction with
        disability benefits that result in the employee’s full biweekly base pay.
        The policy prevents employees\r\nfrom using leave bank hours that result in
        pay that is greater than their biweekly base rate. I understand that the\r\nappropriate
        use of your leave bank hours must be because of and consistent with the leave
        granted and that I have\r\nprovided my department with payroll instructions
        during my leave of absence.\r\n6. My dependent(s) eligibility for health care
        coverage is contingent on my submitting the proper forms within 31 days\r\nof
        (1) acquiring a new dependent (birth, marriage, placement for adoption, permanent
        legal custody), (2) a current\r\ndependent losing eligibility (divorce, dependent
        child turns age 26, death), even when the event occurs during my\r\nleave
        of absence.\r\n7. I must comply with the Flexible Benefits Program Open Enrollment
        rules even if I am on leave of absence. Any\r\napplicable forms must be completed
        and submitted during the open enrollment period, not when I return from leave
        of\r\nabsence and failure to comply may jeopardize my participation.\r\n8.
        I agree to notify my department of any change of address and/or phone number.
        I understand and agree that all\r\ncommunications from the County of Ventura
        will be sent to the address I have on file and that I am responsible for\r\nacknowledging
        information sent to the address on file. READ THE TERMS CAREFULLY BEFORE INITIALING.
        I understand that:\r\nI am bound by all the terms and conditions of the County’s
