    label: Waiver of Disability Benefits
    page_number: 4
    position: 17
    required: false
    options:
      information_text: "If you choose not to file a claim for disability benefits
        with your group disability plan(s) and are requesting a paid leave, you\r\nmust
        read and sign this waiver, and submit it to your agency/department in advance
        of your leave of absence. After\r\nreceiving the signed Waiver, you will be
        allowed to use the appropriate hours from your leave bank balances in increments\r\nto
        equal your full biweekly schedule, and until balances are exhausted or you
        stop authorizing leave bank usage.\r\nBy not filing a claim with your disability
        plan(s), you may be forfeiting a variety of benefits including but not limited
        to: full\r\nand partial disability benefit payments, Return to Work Incentive
        payments, Reasonable Accommodation Expense\r\nBenefits and Temporary Recovery
        benefits. Please note that each plan has an application deadline, after which
        you forfeit\r\nall rights to benefits. Your department representative may
        provide a copy of this signed Waiver to your group disability\r\nplan(s) and
        to County Human Resources.\r\nI understand that leave bank usage must begin
        at the onset of my leave of absence. I further understand that if I change\r\nmy
        decision and later elect to file a claim for any group disability plan(s),
        I will be expected to repay the County of Ventura\r\nand/or any group disability
        plan(s) that has paid me any disability benefit(s) for the same time period
        of this Waiver.\r\nI have read this form and acknowledge that I understand
        and agree not to file for disability benefits with any group\r\ndisability
        plan(s) for this leave of absence. I authorize use of my leave bank balances
        in order to receive pay equal to my\r\nfull regular work schedule for the
