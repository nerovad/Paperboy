---
forms:
- class_name: BikeLockerForm
  name: Bike Locker
  page_count: 3
  page_headers:
  - Locker Information
  submission_type: approval
  description: 'Fill out the Bike Locker form to reserve a bike locker on campus. '
  form_number: GSA-101
  form_type: Request
  agency_id: GSA
  division_id: '4660'
  department_id: '4661'
  unit_id: '4661'
  fields:
  - field_name: locker_location
    field_type: dropdown
    label: Locker Location
    page_number: 3
    position: 0
    required: true
    options:
      values:
      - 669 CSD
      - A Lot
      - E Lot
      - ECCH
      - FJC Ventura
      - G Lot
      - H Lot
      - Partridge
      - R Lot
      - Saticoy Yard
      - TRB
      - Vangaurd
      - Williams
    read_only: none
    has_custom_view: true
    visible_to_filler: false
    restricted_to_type: none
  - field_name: locker_number
    field_type: dropdown
    label: Locker Number
    page_number: 3
    position: 1
    required: true
    options:
      values:
      - '1'
      - '2'
      - '3'
      - None Available
    read_only: none
    has_custom_view: true
    visible_to_filler: false
    restricted_to_type: none
  - field_name: terms_and_conditions
    field_type: information
    label: Terms and Conditions
    page_number: 3
    position: 2
    required: true
    options:
      information_text: "Terms and Conditions\r\n\r\n \r\n\r\n1. The County and the
        Employee Transportation Program disclaim any liability for the loss of personal\r\nproperty
        stored in the bike lockers.\r\n\r\n \r\n\r\n2. Bike Lockers are reserved for
        workday storage of bicycles only.\r\n\r\n \r\n\r\n3. The County and the Employee
        Transportation Program reserve the right to revoke this permit at their\r\ndiscretion.\r\n\r\n
        \r\n\r\n4. The user understands and agrees that this locker permit is issued
        because the user frequently commutes\r\nby bicycle to the Government Center
        complex or off-site County location. If regular bicycle commuting\r\nceases,
        the user agrees to relinquish this permit, vacate the locker and notify the
        Employee Transportation\r\nCoordinator at 805-654-2051.\r\n\r\n \r\n\r\n5.
        If a locker appears to be unused or abandoned, the Employee Transportation
        Coordinator will contact\r\nthe registered user by telephone or e-mail and
        by posting a written notice on the locker. If the user cannot\r\nbe found
        and if a response to the written notice is not received after five (5) working
        days, the County\r\nretains the right to cut the lock and remove the locker
        contents.\r\n\r\n \r\n\r\n6. The user agrees to keep the padlock (provided
        by the user) in a clean and rust free condition. Please see\r\na list of recommended
        locks here:\r\n\r\n \r\n\r\n \r\n\r\n7. The user agrees to keep the locker
        clean and clutter free and will be responsible for any damages due to\r\nmisuse
        or abuse.\r\n\r\n \r\n\r\n8. The user agrees to remove the padlock and the
        contents from the locker when notified via email of\r\nupcoming locker maintenance.\r\n\r\n9.
        By clicking \"Submit\" I agree to the above Conditions."
      acknowledgeable: true
    read_only: none
    has_custom_view: false
    visible_to_filler: false
    restricted_to_type: none
