production: &production
  scheduled_reports_runner:
    class: ScheduledReportsRunnerJob
    queue: default
    schedule: every minute
    description: Checks and executes due scheduled reports and exports
  form_subscription_digest:
    class: FormSubscriptionDigestJob
    queue: default
    schedule: at 7am every day
    description: Sends the daily form-activity digest
  away_period_sweep:
    class: AwayPeriodSweepJob
    queue: default
    schedule: at 6:10am every day
    description: Reassigns inboxes covered by an away period
  probation_requests_expiry:
    class: ProbationRequestsExpiryJob
    queue: default
    schedule: at 2am every day
    description: Expires due probation requests
  osha_reportable_deadline:
    class: OshaReportableDeadlineJob
    queue: default
    schedule: every hour
    description: Processes reportable OSHA deadlines
  aim_stamp_approved:
    class: Aim::StampApprovedJob
    queue: default
    schedule: every 10 minutes
    description: Stamps approved AIM invoices that have no approval stamp yet
  aim_code_ready:
    class: Aim::CodeReadyJob
    queue: default
    schedule: every 10 minutes
    description: Codes AIM invoices waiting for approval from the coding rules
  aim_straight_to_fiscal:
    class: Aim::StraightToFiscalJob
    queue: default
    schedule: every minute
    description: Approves AIM invoices uploaded straight to Fiscal once the AI has read them
  aim_duplicate_check:
    class: Aim::DuplicateCheckJob
    queue: default
    schedule: every minute
    description: Flags possible duplicate AIM invoices for AIM staff
  aim_alert_digest:
    class: Aim::AlertDigestJob
    queue: default
    schedule: at 7am every day
    description: Emails AIM's daily alert digest; nothing unless AIM_EMAIL_ALERTS=on
  aim_purge_fiscal_reports:
    class: Aim::PurgeFiscalReportsJob
    queue: default
    schedule: at 3am every day
    description: Purges the files of AIM Fiscal reports a year old
  aim_purge_deleted_pdfs:
    class: Aim::PurgeDeletedPdfsJob
    queue: default
    schedule: at 3:30am every day
    description: Purges the PDFs of AIM invoices deleted past the retention period; nothing unless AIM_PURGE_DELETED_PDFS=on
  dam_watch_folders:
    class: Dam::WatchFolderIngestJob
    queue: default
    schedule: every minute
    description: Ingests files dropped into DAM storage locations' watch folders

staging:
  <<: *production

development:
  <<: *production
