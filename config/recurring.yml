production: &production
  scheduled_reports_runner:
    class: ScheduledReportsRunnerJob
    queue: default
    schedule: every minute
    description: Checks and executes due scheduled reports and exports
  form_subscription_digest:
    class: FormSubscriptionDigestJob
    queue: default
    schedule: at 7am every day
    description: Sends the daily form-activity digest
  away_period_sweep:
    class: AwayPeriodSweepJob
    queue: default
    schedule: at 6:10am every day
    description: Reassigns inboxes covered by an away period
  probation_requests_expiry:
    class: ProbationRequestsExpiryJob
    queue: default
    schedule: at 2am every day
    description: Expires due probation requests
  osha_reportable_deadline:
    class: OshaReportableDeadlineJob
    queue: default
    schedule: every hour
    description: Processes reportable OSHA deadlines

staging:
  <<: *production

development:
  <<: *production
