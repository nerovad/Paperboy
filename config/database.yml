# config/database.yml

# Shared connection settings for GSABSS SQL Server
sqlserver: &sqlserver
  adapter: sqlserver
  host: <%= ENV.fetch("GSABSS_HOST") %>
  port: <%= ENV.fetch("GSABSS_PORT").to_i %>
  # Auth mode:
  #   SQL login (no backslash) -> those credentials. CI uses this.
  #   unset, or DOMAIN\user on Linux -> Kerberos from the ticket in KRB5CCNAME.
  # DOMAIN\user is NTLM. WSL, Ubuntu, and Arch are not on the domain, so SQL
  # Server rejects it as an untrusted domain. Windows still receives it (SSPI).
  # Kerberos requires tiny_tds built against the system FreeTDS
  # (see Gemfile: force_ruby_platform: true) - the precompiled gem has no GSSAPI.
<% require_relative '../lib/paperboy/sql_login' %>
<% if Paperboy::SqlLogin.sql_credentials?(ENV["GSABSS_USERNAME"]) %>
  username: <%= ENV["GSABSS_USERNAME"] %>
  password: <%= ENV["GSABSS_PASSWORD"] %>
<% end %>
  timeout: <%= ENV.fetch("GSABSS_TIMEOUT", 5).to_i %>
  encoding: utf8
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

# Primary connection: Paperboy-specific database for form submissions, etc.
# PAPERBOY_LOCAL_SOLID is set by bin/dev. The dev server, staging, and
# production leave it unset, so their Solid tables stay in SQL Server.
development:
<% if ENV['PAPERBOY_LOCAL_SOLID'] == '1' %>
  primary:
    <<: *sqlserver
    database: <%= ENV.fetch("PAPERBOY_DATABASE", "Paperboy_Dev") %>
  queue:
    adapter: sqlite3
    database: storage/solid_queue.sqlite3
    migrations_paths: db/queue_migrate
    pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
    timeout: 5000
  cache:
    adapter: sqlite3
    database: storage/solid_cache.sqlite3
    migrations_paths: db/cache_migrate
    pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
    timeout: 5000
  cable:
    adapter: sqlite3
    database: storage/solid_cable.sqlite3
    migrations_paths: db/cable_migrate
    pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
    timeout: 5000
<% else %>
  <<: *sqlserver
  database: <%= ENV.fetch("PAPERBOY_DATABASE", "Paperboy_Dev") %>
<% end %>

test:
  <<: *sqlserver
  database: <%= ENV.fetch("PAPERBOY_TEST_DATABASE", "Paperboy_Test") %>

staging:
  <<: *sqlserver
  database: <%= ENV.fetch("PAPERBOY_DATABASE", "Paperboy_Stage") %>

production:
  <<: *sqlserver
  database: <%= ENV.fetch("PAPERBOY_DATABASE", "Paperboy_Prod") %>

# Shared GSABSS tables (Employees + the org reference tables)
# Read-only reference data owned by the org, not Paperboy.
# NOTE: Groups, Employee_Groups and Group_Permissions are NOT here — they live
# in each Paperboy_* database above, so ACLs are per-environment. `rake acl:sync`
# mirrors the definitions between them; see lib/tasks/acl.rake.
gsabss:
  <<: *sqlserver
  database: <%= ENV.fetch("GSABSS_DATABASE", "GSABSS") %>

# MSSQL connection for billing stored procedures (TC60, Invoices)
# Same DB server, separate connection pool
billing:
  <<: *sqlserver
  database: <%= ENV.fetch("GSABSS_DATABASE", "GSABSS") %>
  azure: false
