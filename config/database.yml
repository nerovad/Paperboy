# config/database.yml

# Shared connection settings for GSABSS SQL Server
sqlserver: &sqlserver
  adapter: sqlserver
  host: <%= ENV.fetch("GSABSS_HOST") %>
  port: <%= ENV.fetch("GSABSS_PORT").to_i %>
  # Auth mode is chosen by whether GSABSS_USERNAME is set:
  #   set   -> SQL/NTLM auth with those credentials (used by CI, which has no AD)
  #   unset -> Kerberos (GSSAPI) using the ticket in KRB5CCNAME, refreshed by
  #            cronjobs/kerberos/run_kinit.sh. This is the mode on all servers.
  # Kerberos requires tiny_tds built against the system FreeTDS
  # (see Gemfile: force_ruby_platform: true) - the precompiled gem has no GSSAPI.
<% unless ENV["GSABSS_USERNAME"].to_s.strip.empty? %>
  username: <%= ENV["GSABSS_USERNAME"] %>
  password: <%= ENV["GSABSS_PASSWORD"] %>
<% end %>
  timeout: <%= ENV.fetch("GSABSS_TIMEOUT", 5).to_i %>
  encoding: utf8
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

# PostgreSQL config (commented out for future use):
# default: &default
#   adapter: postgresql
#   host: <%= ENV.fetch("POSTGRES_HOST", "localhost") %>
#   port: <%= ENV.fetch("POSTGRES_PORT", 5432).to_i %>
#   username: <%= ENV.fetch("POSTGRES_USERNAME", "postgres") %>
#   password: <%= ENV.fetch("POSTGRES_PASSWORD", "") %>
#   encoding: unicode
#   pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

# Primary connection: Paperboy-specific database for form submissions, etc.
development:
  <<: *sqlserver
  database: <%= ENV.fetch("PAPERBOY_DATABASE", "Paperboy_Dev") %>

test:
  <<: *sqlserver
  database: <%= ENV.fetch("PAPERBOY_TEST_DATABASE", "Paperboy_Test") %>

staging:
  <<: *sqlserver
  database: <%= ENV.fetch("PAPERBOY_DATABASE", "Paperboy_Stage") %>

production:
  <<: *sqlserver
  database: <%= ENV.fetch("PAPERBOY_DATABASE", "Paperboy_Prod") %>

# Shared GSABSS tables (Employees + the org reference tables)
# Read-only reference data owned by the org, not Paperboy.
# NOTE: Groups, Employee_Groups and Group_Permissions are NOT here — they live
# in each Paperboy_* database above, so ACLs are per-environment. `rake acl:sync`
# mirrors the definitions between them; see lib/tasks/acl.rake.
gsabss:
  <<: *sqlserver
  database: <%= ENV.fetch("GSABSS_DATABASE", "GSABSS") %>

# MSSQL connection for billing stored procedures (TC60, Invoices)
# Same DB server, separate connection pool
billing:
  <<: *sqlserver
  database: <%= ENV.fetch("GSABSS_DATABASE", "GSABSS") %>
  azure: false
