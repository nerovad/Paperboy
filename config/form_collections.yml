# Form Library collections — named groups of forms for one audience, each with
# its own page at /form_library/collections/<key>.
#
# PROTOTYPE (#96): collections live in this file so the library can be shown
# without a schema change. The real thing is a table and an admin screen.
#
# A form belongs to a collection when any one rule matches it:
#
#   tags      it carries one of these tags (case is ignored)
#   agencies  it is issued by one of these agency codes
#   forms     it is named here outright — a hand-picked member
#
# A collection the viewer has no forms in is not shown to them.
human_resources:
  name: Human Resources
  description: Leave, schedules, telework and employee benefits.
  tags: [hr, loa]
  forms:
    - Telework Log
    - Work Schedule or Location Update
    - Workplace Violence

safety:
  name: Safety & Risk
  description: Incident, injury and OSHA reporting.
  tags: [safety, osha, rm75, rm75i]

parking_and_vehicles:
  name: Parking & Vehicles
  description: Permits, fleet garaging and bike lockers.
  tags: [parking, parking permit, cars, transportation]

purchasing:
  name: Purchasing & Payments
  description: P-Cards, reimbursements and billing changes.
  tags: [procurement, payment, money, billing]
