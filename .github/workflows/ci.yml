name: CI

on:
  pull_request:
  push:
    branches: [ master ]

permissions:
  contents: write

# CI_RUNNER_LABEL is a placeholder until Gary names the Windows runner.
# uses: resolves against the Gitea server's [actions] DEFAULT_ACTIONS_URL;
# a mirror is that server setting or an absolute uses: https://... URL.

jobs:
  lint:
    name: Lint and security
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'windows' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint Ruby
        shell: bash
        run: bundle exec rubocop

      - name: Scan Rails security
        shell: bash
        run: bundle exec brakeman

      - name: Audit Ruby dependencies
        shell: bash
        run: bundle exec bundle-audit check

  test:
    name: Tests
    needs: lint
    # The test job stays skipped until CI_SQL_HOST is set.
    if: ${{ vars.CI_SQL_HOST != '' }}
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'windows' }}
    env:
      RAILS_ENV: test
      # One worker: test_helper.rb otherwise creates a database per worker,
      # and the CI login cannot create databases.
      PARALLEL_WORKERS: '1'
      GSABSS_HOST: ${{ vars.CI_SQL_HOST }}
      GSABSS_PORT: ${{ vars.CI_SQL_PORT || '1433' }}
      GSABSS_USERNAME: ${{ secrets.CI_SQL_USERNAME }}
      GSABSS_PASSWORD: ${{ secrets.CI_SQL_PASSWORD }}
      GSABSS_DATABASE: ${{ vars.CI_SQL_DATABASE || 'Paperboy_CI' }}
      PAPERBOY_TEST_DATABASE: ${{ vars.CI_SQL_DATABASE || 'Paperboy_CI' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Reset CI database
        shell: bash
        run: bundle exec rails ci:reset_database

      - name: Run tests
        shell: bash
        run: bundle exec rails test

      # CI_SYSTEM_TESTS gates system tests; Chrome must be on the runner.
      - name: Run system tests
        if: ${{ vars.CI_SYSTEM_TESTS == 'true' }}
        shell: bash
        run: bundle exec rails test:system

      - name: Keep screenshots from failed system tests
        if: ${{ failure() && vars.CI_SYSTEM_TESTS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tmp/screenshots
          if-no-files-found: ignore

  tag-master-commit:
    name: Tag master commit
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'windows' }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create commit tag
        shell: bash
        run: bash bin/tag-master-commit
