inherit_from: .rubocop_todo.yml
inherit_mode:
  merge:
    - Exclude

AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.0
  UseCache: false
  Exclude:
    # Generated by `db:schema:dump` on every migration. The dumper and this
    # style guide disagree permanently, so linting it only churns the file.
    - 'db/schema.rb'
    # Solid Queue, Cache, and Cable install dumps. Same dumper, same disagreement.
    - 'db/queue_schema.rb'
    - 'db/cache_schema.rb'
    - 'db/cable_schema.rb'
    # Generated by the form builder; the generated structure is intentionally
    # consistent with the source form rather than the style guide.
    - 'app/services/sheriff_safety_reporting_form_pdf_generator.rb'
    - 'db/migrate/20260912015519_create_sheriff_safety_reporting_forms_20260912015519.rb'
    - 'worktrees/**/*'

Layout/LineLength:
  Max: 183

# The Windows CI runner would otherwise read `native` as CRLF; the repository
# is LF everywhere.
Layout/EndOfLine:
  EnforcedStyle: lf

Layout/ExtraSpacing:
  Enabled: false

Metrics/AbcSize:
  Max: 67
  Exclude:
    - "app/controllers/forms/**/*_controller.rb"

Metrics/BlockLength:
  Max: 107

Metrics/CyclomaticComplexity:
  Max: 16
  Exclude:
    - "app/controllers/forms/**/*_controller.rb"

Metrics/ClassLength:
  Exclude:
    - "app/controllers/forms/**/*_controller.rb"
    - "app/services/navigation_catalog.rb"
    - "app/models/forms/field.rb"
    - "app/models/forms/template.rb"
    - "app/models/forms/template_routing_step.rb"
    - "app/services/forms/inbox_query.rb"
    - "app/services/form_lookup.rb"
    # Seven REST actions plus five member ones, each a few lines: the length is
    # the number of things a storage location can be asked to do, not a method
    # that grew.
    - "app/controllers/digital_asset_management/storage_locations_controller.rb"
    # Seven REST actions, three member ones and the loaders behind them:
    # browsing, ingesting, sharing and publishing an asset all live here
    # because they are all things one asset page offers.
    - "app/controllers/digital_asset_management/assets_controller.rb"
    # A table of four OAuth providers and the small ways each of them differs
    # from the others. The length is how many services publish, not a class
    # doing several jobs.
    - "app/services/dam/publishing/oauth.rb"
    # One test per conversation a publish provider has; splitting them by
    # count rather than by subject would only make them harder to find.
    - "test/services/dam/publishing/runner_test.rb"
    - "test/services/dam/publishing/adapters_test.rb"
    - "test/controllers/digital_asset_management/publications_controller_test.rb"

Metrics/MethodLength:
  Max: 44
  Exclude:
    - "app/controllers/forms/**/*_controller.rb"

Metrics/ModuleLength:
  Max: 146

Metrics/ParameterLists:
  Max: 8

Metrics/PerceivedComplexity:
  Max: 14
  Exclude:
    - "app/controllers/forms/**/*_controller.rb"
    - "app/models/forms/template_routing_step.rb"

Style/MultilineBlockChain:
  Exclude:
    - "app/models/forms/template_routing_step.rb"
Style/StringLiterals:
  Enabled: true
  EnforcedStyle: single_quotes

Naming/MethodParameterName:
  MinNameLength: 1

Style/Documentation:
  Enabled: false
